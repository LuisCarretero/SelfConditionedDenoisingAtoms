[workspace]
name = "scd"
version = "0.1.0"
description = "Self-Conditioned Denoising for Atomistic Representation Learning"
authors = ["Luis Carretero"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
pip = "*"
pandas = "*"
scipy = "*"
numpy = ">=2.0,<2.3"
sympy = ">=1.13.3"
ase = ">=3.22"
pymatgen = ">=2023.0.0"
rdkit = "*"
huggingface_hub = ">=0.20,<1.0"
fsspec = "<2024.0"
tqdm = ">=4.62"
matplotlib = ">=3.4"
pyyaml = ">=5.4"
pytest = ">=7"
ruff = ">=0.10"
scikit-learn = ">=1.0"
# torchtnt-style transitive pulls `pkg_resources`; modern setuptools (>=80) splits it out.
# Keep <80 so legacy import sites still work (same pin as MLIP_propbench).
setuptools = "<80"

[pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu126" }
# PyTorch Lightning + torch-geometric drive the train loop and graph ops.
pytorch-lightning = ">=2.0"
lightning-utilities = "*"
torch-geometric = ">=2.4"
datasets = ">=2.0"
wandb = ">=0.12"
# PyG CUDA extensions (torch_scatter/cluster/sparse) are imported by data/loaders.py and
# models/ET_models/frad/*. Their PyG wheel index is a flat HTML listing pixi can't read as
# a PEP-503 index, so we install them via `pixi run install-pyg` (one-time post-install).

[tasks]
# One-time post-install: PyG CUDA wheels for torch 2.8 + cu126. The PyG index is a flat
# HTML page, not a PEP-503 index, so pixi can't resolve it — invoke pip with `-f` instead.
install-pyg = "python -m pip install --no-build-isolation -f https://data.pyg.org/whl/torch-2.8.0%2Bcu126.html torch-scatter torch-cluster torch-sparse"
# Env-sanity check on a fresh GPU node — does NOT exercise SCD model code (see smoketest.py).
smoketest = "python -u scripts/setup/smoketest.py"
# Build the optimised TorchMD-Net neighbor kernel against the env's torch. Required for
# `noise_in_loader=False` (the default in configs/finetune_qm9.yaml). Run from a GPU node.
build-kernel = { cmd = "python setup.py build_ext --inplace", cwd = "models/ET_models" }
# Read-only lint report (CI-style). Config in ruff.toml.
lint = "ruff check ."
fix = "ruff check --fix ."
format = "ruff format ."
format-check = "ruff format --check ."
train = "python -u train.py"
test = "python -m pytest tests/"
